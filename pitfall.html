<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>落とし穴からの脱出</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:'DotGothic16', sans-serif;
  overflow:hidden;
}

.screen{
  display:none;
  width:100vw;
  height:100vh;
  position:relative;
  padding:16px;
}

.screen.active{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.title{
  font-size:34px;
  line-height:1.4;
  margin-bottom:12px;
  text-shadow:3px 3px 0 #000;
}

.sub{
  font-size:18px;
  color:#ddd;
  margin-bottom:18px;
  line-height:1.6;
}

.btn{
  font-family:'DotGothic16', sans-serif;
  background:#1a1a1a;
  color:#fff;
  border:4px solid #fff;
  padding:14px 24px;
  font-size:24px;
  cursor:pointer;
  box-shadow:5px 5px 0 #000;
}

.btn:active{
  transform:translate(3px,3px);
  box-shadow:2px 2px 0 #000;
}

.ground{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:38%;
  background:
    repeating-linear-gradient(
      90deg,
      #5c3b1a 0 24px,
      #6d4720 24px 48px
    );
  border-top:6px solid #2d1a0c;
}

.holes{
  position:absolute;
  left:50%;
  bottom:18%;
  transform:translateX(-50%);
  width:min(92vw, 430px);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  z-index:2;
}

.hole-wrap{
  width:30%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.hole-btn{
  font-family:'DotGothic16', sans-serif;
  width:100%;
  max-width:110px;
  background:#1a1a1a;
  color:#fff;
  border:3px solid #fff;
  padding:8px 0;
  font-size:22px;
  margin-bottom:10px;
  cursor:pointer;
}

.hole{
  width:100%;
  height:64px;
  background:#000;
  border:4px solid #333;
  border-radius:50%;
  box-shadow:inset 0 10px 16px rgba(255,255,255,0.06);
}

.runner{
  position:absolute;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  font-size:68px;
  z-index:3;
  transition:left 0.45s ease, top 0.45s ease, transform 0.45s ease, opacity 0.45s ease;
}

.runner.fall{
  top:64%;
  transform:translateX(-50%) scale(0.35) rotate(18deg);
}

.runner.escape{
  top:10%;
  transform:translateX(-50%) scale(1.15);
}

.flash{
  animation:flash 0.18s 4 alternate;
}
@keyframes flash{
  from{ opacity:1; }
  to{ opacity:0.2; }
}

.label-row{
  position:absolute;
  left:50%;
  bottom:8%;
  transform:translateX(-50%);
  width:min(92vw, 430px);
  display:flex;
  justify-content:space-between;
  color:#aaa;
  font-size:14px;
}

.result-box{
  width:min(92vw, 420px);
  background:#000;
  border:4px solid #fff;
  padding:24px 16px;
  box-shadow:7px 7px 0 #333;
}

.result-main{
  font-size:32px;
  line-height:1.5;
  margin-bottom:14px;
  white-space:pre-line;
}

.result-sub{
  font-size:20px;
  line-height:1.6;
  color:#ddd;
  margin-bottom:18px;
  white-space:pre-line;
}

.note{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  color:#888;
  width:90%;
}

.top-banner{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  font-size:15px;
  color:#ffdf6b;
  text-shadow:2px 2px 0 #000;
}

@media (max-width:420px){
  .title{
    font-size:28px;
  }
  .sub{
    font-size:16px;
  }
  .btn{
    font-size:20px;
    padding:12px 18px;
  }
  .result-main{
    font-size:28px;
  }
}
</style>
</head>
<body>

<div id="startScreen" class="screen active">
  <div class="top-banner">MINNA NO KUSOGE 001</div>
  <div class="title">落とし穴からの脱出</div>
  <div class="sub">3つの穴がある。<br>1つだけ助かる。</div>

  <button class="btn" onclick="startGame()">スタート</button>
  <div class="note">※ 見た目で判断しても、たぶん無駄です</div>
</div>

<div id="gameScreen" class="screen">
  <div class="top-banner">穴を えらべ！</div>
  <div class="title" style="font-size:26px;margin-bottom:8px;">どの穴にする？</div>
  <div class="sub" style="margin-bottom:0;">1つだけ当たり</div>

  <div id="runner" class="runner">🐶</div>

  <div class="ground"></div>

  <div class="holes">
    <div class="hole-wrap">
      <button class="hole-btn" onclick="chooseHole(0)">①</button>
      <div class="hole"></div>
    </div>
    <div class="hole-wrap">
      <button class="hole-btn" onclick="chooseHole(1)">②</button>
      <div class="hole"></div>
    </div>
    <div class="hole-wrap">
      <button class="hole-btn" onclick="chooseHole(2)">③</button>
      <div class="hole"></div>
    </div>
  </div>

  <div class="label-row">
    <div>あな1</div>
    <div>あな2</div>
    <div>あな3</div>
  </div>

  <div class="note">あきらかに全部あぶない</div>
</div>

<div id="resultScreen" class="screen">
  <div class="result-box">
    <div id="resultMain" class="result-main"></div>
    <div id="resultSub" class="result-sub"></div>
    <button class="btn" onclick="location.reload()">もう一回</button>
  </div>
</div>

<script>
let safeHole = 0;
let locked = false;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(){
  safeHole = Math.floor(Math.random() * 3);
  locked = false;
  showScreen('gameScreen');
}

function chooseHole(index){
  if(locked) return;
  locked = true;

  const runner = document.getElementById('runner');
  const lefts = ['20%', '50%', '80%'];
  runner.style.left = lefts[index];

  setTimeout(() => {
    if(index === safeHole){
      runner.classList.add('escape');
      setTimeout(() => {
        showScreen('resultScreen');
        document.getElementById('resultMain').textContent = '…あれ？\n助かった！？';
        document.getElementById('resultSub').textContent = 'YOU WIN！🎉';
      }, 500);
    } else {
      runner.classList.add('fall');
      runner.classList.add('flash');
      setTimeout(() => {
        showScreen('resultScreen');
        document.getElementById('resultMain').textContent = 'ヒューン…\nドン！！';
        document.getElementById('resultSub').textContent = 'そんなもんあるか笑\nGAME OVER';
      }, 500);
    }
  }, 250);
}
</script>

</body>
</html>
