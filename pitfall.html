<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>落とし穴からの脱出</title>
<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:monospace;
  text-align:center;
}
canvas {
  background:#111;
  display:block;
  margin:0 auto;
}
button {
  font-size:20px;
  margin:10px;
}
</style>
</head>
<body>

<h2>落とし穴からの脱出</h2>
<button onclick="startGame()">START</button>
<canvas id="game" width="360" height="480"></canvas>

<script>

// ===== 基本 =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let state;

// ===== 初期化 =====
function startGame(){
  state = {
    playerX:20,
    playerY:280,
    safeIndex:Math.floor(Math.random()*3),
    boards:[
      {x:50},
      {x:150},
      {x:250}
    ],
    alive:true
  };
  loop();
}

// ===== ループ =====
function loop(){
  update();
  draw();
  if(state.alive) requestAnimationFrame(loop);
}

// ===== 更新 =====
function update(){
}

// ===== 描画 =====
function draw(){
  ctx.clearRect(0,0,360,480);

  // 板
  state.boards.forEach((b,i)=>{
    ctx.fillStyle = (i===state.safeIndex)?"green":"brown";
    ctx.fillRect(b.x,300,80,20);
  });

  // プレイヤー
  ctx.fillStyle="white";
  ctx.fillRect(state.playerX, state.playerY, 20,20);
}

// ===== 入力 =====
document.addEventListener("keydown",e=>{
  if(!state.alive) return;

  if(e.key==="ArrowRight") state.playerX+=20;
  if(e.key==="ArrowLeft") state.playerX-=20;

  check();
});

// ===== 判定 =====
function check(){
  let hit = -1;

  state.boards.forEach((b,i)=>{
    if(state.playerX >= b.x && state.playerX <= b.x+80){
      hit = i;
    }
  });

  if(hit===-1) return;

  if(hit===state.safeIndex){
    // 成功
    state.safeIndex = Math.floor(Math.random()*3);
  }else{
    // 落下
    alert("落ちた！");
    state.alive=false;
  }
}

</script>

</body>
</html>
