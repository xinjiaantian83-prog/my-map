<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script>
const VERSION = "v7";
if (localStorage.getItem("game_version") !== VERSION) {
  localStorage.setItem("game_version", VERSION);
  location.reload(true);
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>肉球タップゲーム</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #fff;
  height: 100vh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

#hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: #fff;
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-bottom: 2px solid #f0e6ff;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(180,130,255,0.08);
}
.hud-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.hud-label {
  font-size: 11px;
  color: #aaa;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.hud-value {
  font-size: 26px;
  font-weight: 800;
  color: #7c3aed;
  line-height: 1.1;
}

#game-area {
  position: fixed;
  top: 60px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}

.paw {
  position: absolute;
  font-size: 56px;
  cursor: pointer;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 4px 12px rgba(124,58,237,0.25));
  display: none;
  line-height: 1;
  touch-action: manipulation;
}
.paw.rare {
  animation: rareFlash 0.35s infinite alternate;
}
.paw.triple {
  animation: tripleBlink 0.3s infinite alternate;
  filter:
    hue-rotate(220deg)
    saturate(1.8)
    brightness(1.2)
    drop-shadow(0 0 6px #60a5fa)
    drop-shadow(0 0 14px #3b82f6);
}

.score-popup {
  position: absolute;
  font-weight: 900;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: top 0.55s ease, opacity 0.55s ease;
}
.score-popup.gold {
  color: gold;
  text-shadow: 0 0 6px #000, 0 0 12px orange;
}
.score-popup.rainbow {
  background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.ripple {
  position: absolute;
  border-radius: 50%;
  width: 60px;
  height: 60px;
  background: rgba(167,139,250,0.45);
  pointer-events: none;
  transform: translate(-50%, -50%) scale(0);
  animation: rippleAnim 0.4s ease-out forwards;
}

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(255,255,255,0.97);
  z-index: 20;
  gap: 20px;
}
.screen.hidden { display: none; }
.screen-emoji  { font-size: 80px; }
.screen-title  { font-size: 28px; font-weight: 900; color: #7c3aed; letter-spacing: -0.5px; }
.screen-sub    { font-size: 15px; color: #888; text-align: center; line-height: 1.6; padding: 0 30px; }

.btn {
  padding: 16px 48px;
  font-size: 18px;
  font-weight: 800;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(124,58,237,0.35);
  transition: transform 0.1s, opacity 0.1s, box-shadow 0.1s;
  min-width: 180px;
  text-align: center;
}
.btn:active {
  transform: scale(0.95);
  box-shadow: 0 2px 10px rgba(124,58,237,0.25);
}

#result-score {
  font-size: 72px;
  font-weight: 900;
  color: #7c3aed;
  line-height: 1;
}
#result-label {
  font-size: 18px;
  color: #aaa;
  font-weight: 600;
  letter-spacing: 1px;
}

#countdown-screen .countdown-num {
  font-size: 120px;
  font-weight: 900;
  color: #7c3aed;
}

#backBtn {
  position: fixed;
  bottom: 20px;
  left: 12px;
  z-index: 10000;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 700;
  color: #333;
  border: none;
  border-radius: 10px;
  background: rgba(255,255,255,0.95);
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  cursor: pointer;
}

@keyframes rareFlash {
  from {
    transform: translate(-50%, -50%) rotate(-6deg);
    filter: hue-rotate(20deg) saturate(1.5) brightness(1.05)
            drop-shadow(0 0 4px #fff7a8) drop-shadow(0 0 10px gold) drop-shadow(0 0 16px orange);
  }
  to {
    transform: translate(-50%, -50%) rotate(6deg);
    filter: hue-rotate(45deg) saturate(2) brightness(1.2)
            drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px gold) drop-shadow(0 0 24px orange);
  }
}
@keyframes tripleBlink {
  from { transform: translate(-50%, -50%) scale(0.75); opacity: 0.7; }
  to   { transform: translate(-50%, -50%) scale(0.85); opacity: 1; }
}
@keyframes rippleAnim {
  to { transform: translate(-50%, -50%) scale(4); opacity: 0; }
}
@keyframes countPop {
  0%   { transform: scale(1.6); opacity: 0.3; }
  60%  { transform: scale(0.9); opacity: 1; }
  100% { transform: scale(1); }
}
@keyframes dangerShake {
  0%   { transform: translate(0,0)       scale(1.3); }
  25%  { transform: translate(-2px, 2px) scale(1.3); }
  50%  { transform: translate(2px, -2px) scale(1.3); }
  75%  { transform: translate(-2px, 1px) scale(1.3); }
  100% { transform: translate(0,0)       scale(1.3); }
}
@keyframes screenShake {
  0%   { transform: translate(0,0); }
  25%  { transform: translate(-4px, 3px); }
  50%  { transform: translate(4px, -3px); }
  75%  { transform: translate(-3px, 2px); }
  100% { transform: translate(0,0); }
}
.shake { animation: screenShake 0.2s; }
</style>
</head>
<body>

<button id="backBtn">← 戻る</button>

<div id="hud">
  <div class="hud-item">
    <span class="hud-label">スコア</span>
    <span class="hud-value" id="score-value">0</span>
  </div>
  <div class="hud-item">
    <span class="hud-label">残り時間</span>
    <span class="hud-value" id="time-value">10</span>
  </div>
</div>

<div id="game-area">
  <div id="paw" class="paw">🐾</div>
</div>

<div class="screen" id="start-screen">
  <div class="screen-emoji">🐾</div>
  <div class="screen-title">肉球タップゲーム</div>
  <div class="screen-sub">10秒間で肉球をできるだけ<br>たくさんタップしよう！</div>
  <button class="btn" id="start-btn">スタート</button>
</div>

<div class="screen hidden" id="countdown-screen">
  <div class="countdown-num" id="countdown-num">3</div>
</div>

<div class="screen hidden" id="result-screen">
  <div class="screen-emoji">🎉</div>
  <div class="screen-title">ゲーム終了！</div>
  <div id="result-label">スコア</div>
  <div id="result-score">0</div>
  <div class="screen-sub" id="result-comment"></div>
  <div id="sponsorBox" style="
    margin-top:16px; padding:14px; border-radius:14px;
    background:#f5f1ff; font-size:14px; text-align:center;
    line-height:1.6; box-shadow:0 4px 12px rgba(124,58,237,0.15);
  ">🐾 今日の補給所<br>（準備中）</div>
  <button class="btn" id="retry-btn">もう一度遊ぶ</button>
</div>

<audio id="seTap"    src="start_ui.mp3"  preload="auto"></audio>
<audio id="seRare"   src="rare_bonus.mp3" preload="auto"></audio>
<audio id="seCount"  src="count.mp3"     preload="auto"></audio>
<audio id="seResult" src="reward.mp3"    preload="auto"></audio>
<audio id="seStart"  src="seTap.mp3"     preload="auto"></audio>
<audio id="seTriple" src="triple.mp3"    preload="auto"></audio>

<script>
const GAME_DURATION = 10;
const SAFE_TOP    = 30;
const SAFE_BOTTOM = 160;
const MARGIN_X    = 50;

const gameArea      = document.getElementById('game-area');
const pawEl         = document.getElementById('paw');
const scoreEl       = document.getElementById('score-value');
const timeEl        = document.getElementById('time-value');
const startScr      = document.getElementById('start-screen');
const countScr      = document.getElementById('countdown-screen');
const resultScr     = document.getElementById('result-screen');
const countNum      = document.getElementById('countdown-num');
const resultScore   = document.getElementById('result-score');
const resultComment = document.getElementById('result-comment');
const startBtn      = document.getElementById('start-btn');
const retryBtn      = document.getElementById('retry-btn');
const backBtn       = document.getElementById('backBtn');

let score           = 0;
let timeLeft        = GAME_DURATION;
let gameTimer       = null;
let active          = false;
let extraPaw        = null;
let thirdPaw        = null;
let forceTripleNext = false;
let tripleChainUsed = false;

const comments = {
  zero:   ["0点で草ww🤣","ナイトモードいらんのか？🌙","どんまい🐾","逆にすごいなこれ😂"],
  low:    ["ほやけんよ笑","🐱 まだまだこれからやね","😆 指あったまってないかも？","🍀 もう一回いこうや"],
  mid:    ["👏 なかなかええ感じやね","🔥 ちょっと調子出てきたな","🐾 そのペースいいね","😊 もう少しで伸びそう"],
  high:   ["⚠️ 突き指注意！","🔥 だいぶ速いね！","🐕 いい動きしとる","💪 かなり仕上がってきた"],
  top:    ["👑 マジかよ！","🏆 トップレベルやね","💥 これはなかなか出んよ","🐕‍🦺 チート使いましたね？！"],
  legend: ["スクショ禁止📸","これ外部持ち出しNGな🤫","ヤッベ！","自慢すんなよ？笑"]
};
function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function getComment(s) {
  if (s === 0)  return getRandom(comments.zero);
  if (s >= 30)  return getRandom(comments.legend);
  if (s < 10)   return getRandom(comments.low);
  if (s < 20)   return getRandom(comments.mid);
  return getRandom(comments.high);
}

let soundEnabled = false;
function unlockSound() {
  if (soundEnabled) return;
  soundEnabled = true;
  ['seTap','seRare','seCount','seResult','seStart','seTriple'].forEach(id => {
    const a = document.getElementById(id);
    if (!a) return;
    a.load();
    a.muted = true;
    a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; });
  });
}
function playSound(id) {
  if (!soundEnabled) return;
  const base = document.getElementById(id);
  if (!base) return;
  const a = base.cloneNode();
  a.currentTime = 0;
  a.play().catch(() => {});
}
function playStartSound() {
  const a = document.getElementById('seStart');
  if (!a) return;
  a.pause();
  a.currentTime = 0;
  a.play().catch(() => {});
}
function playDirect(id) {
  const a = document.getElementById(id);
  if (!a) return;
  a.pause();
  a.currentTime = 0;
  a.play().catch(() => {});
}
function safeX() {
  return MARGIN_X + Math.random() * (gameArea.offsetWidth - MARGIN_X * 2);
}
function safeY() {
  return SAFE_TOP + Math.random() * (gameArea.offsetHeight - SAFE_TOP - SAFE_BOTTOM);
}

function clearExtraPaws() {
  if (extraPaw) { extraPaw.remove(); extraPaw = null; }
  if (thirdPaw) { thirdPaw.remove(); thirdPaw = null; }
}

function makePaw(isRare, isTriple) {
  const el = document.createElement('div');
  el.className = 'paw';
  el.textContent = '🐾';
  el.dataset.hit = '';
  el.style.display = 'block';
  el.style.left = safeX() + 'px';
  el.style.top  = safeY() + 'px';
  el.style.pointerEvents = 'auto';
  if (isTriple)    el.classList.add('triple');
  else if (isRare) el.classList.add('rare');
  el.addEventListener('touchstart', onPawTap, { passive: false });
  gameArea.appendChild(el);
  return el;
}

function placePaw() {
  clearExtraPaws();

  pawEl.classList.remove('rare', 'triple');
  pawEl.dataset.hit = '';
  pawEl.style.pointerEvents = 'auto';
  pawEl.style.left    = safeX() + 'px';
  pawEl.style.top     = safeY() + 'px';
  pawEl.style.display = 'block';

  if (Math.random() >= 0.3) return;

  setTimeout(() => {
    if (!active) return;
    const mainRare = Math.random() < 0.5;
    if (mainRare) pawEl.classList.add('rare');
    extraPaw = makePaw(!mainRare, false);

    const doTriple = forceTripleNext || Math.random() < 0.35;
    forceTripleNext = false;
    if (doTriple) {
      setTimeout(() => {
        if (!active) return;
        thirdPaw = makePaw(false, true);
      }, 350);
    }
  }, 200);
}

function spawnRipple(x, y) {
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = x + 'px';
  r.style.top  = y + 'px';
  gameArea.appendChild(r);
  r.addEventListener('animationend', () => r.remove());
}

function showScorePopup(pts, x, y) {
  const el = document.createElement('div');
  el.className = 'score-popup';
  el.textContent = '+' + pts;
  el.style.left = x + 'px';
  el.style.top  = y + 'px';

  if (pts === 4) {
    el.classList.add('rainbow');
    el.style.fontSize = '46px';
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 200);
  } else if (pts === 3) {
    el.classList.add('gold');
    el.style.fontSize = '34px';
  } else {
    el.style.fontSize = '28px';
    el.style.color = '#fff';
    el.style.textShadow = '0 0 6px #000, 0 0 10px #000';
  }

  gameArea.appendChild(el);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      el.style.top     = (y - 60) + 'px';
      el.style.opacity = '0';
    });
  });
  setTimeout(() => el.remove(), 600);
}

function onPawTap(e) {
  if (!active) return;
  e.preventDefault();
  e.stopPropagation();

  const tappedPaw = e.currentTarget;
  if (tappedPaw.dataset.hit === '1') return;
  tappedPaw.dataset.hit = '1';
  tappedPaw.style.pointerEvents = 'none';
  tappedPaw.style.display = 'none';

  let pts = 1;
  if (tappedPaw.classList.contains('triple')) {
    pts = 4;
    playSound('seTriple');
    if (!tripleChainUsed) { forceTripleNext = true; tripleChainUsed = true; }
  } else if (tappedPaw.classList.contains('rare')) {
    pts = 3;
    playSound('seRare');
  } else {
    playSound('seTap');
  }

  score += pts;
  scoreEl.textContent = score;

  const rect  = gameArea.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  const rx    = touch.clientX - rect.left;
  const ry    = touch.clientY - rect.top;

  spawnRipple(rx, ry);
  showScorePopup(pts, rx, ry);

  setTimeout(() => { if (active) placePaw(); }, 60);
}

pawEl.addEventListener('touchstart', onPawTap, { passive: false });

function startGame() {
  score           = 0;
  timeLeft        = GAME_DURATION;
  tripleChainUsed = false;
  forceTripleNext = false;
  scoreEl.textContent    = '0';
  timeEl.textContent     = GAME_DURATION;
  timeEl.style.color     = '';
  timeEl.style.animation = '';
  timeEl.style.transform = 'scale(1)';
  active = true;
  placePaw();

  gameTimer = setInterval(() => {
    timeLeft--;
    timeEl.textContent = timeLeft;
    if (timeLeft === 2 || timeLeft === 1) {
      timeEl.style.color     = '#ff0000';
      timeEl.style.animation = 'dangerShake 0.2s infinite';
      playSound('seCount');
    } else {
      timeEl.style.color     = '';
      timeEl.style.animation = '';
      timeEl.style.transform = 'scale(1)';
    }
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  clearInterval(gameTimer);
  active = false;
  timeEl.style.color     = '';
  timeEl.style.animation = '';
  pawEl.style.display    = 'none';
  clearExtraPaws();

  resultScore.textContent   = score;
  resultComment.textContent = getComment(score);

  const sponsorBox = document.getElementById('sponsorBox');
  if (sponsorBox) {
    sponsorBox.innerHTML = '🐾 今日の補給所<br>テストカフェ&ensp;コーヒー100円引き';
  }

  setTimeout(() => {
    resultScr.classList.remove('hidden');
   setTimeout(() => playDirect('seResult'), 300);
  }, 600);

  const total = Number(localStorage.getItem('wanwan_score') || 0) + score;
  localStorage.setItem('wanwan_score', total);
}

function runCountdown(cb) {
  countScr.classList.remove('hidden');
  let n = 3;
  function tick() {
    if (n <= 0) {
      countScr.classList.add('hidden');
      cb();
      return;
    }
    countNum.textContent = n;
    countNum.style.animation = 'none';
    void countNum.offsetWidth;
    countNum.style.animation = 'countPop 0.6s ease-out';
    n--;
    setTimeout(tick, 700);
  }
  tick();
}

startBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  e.stopPropagation();
 unlockSound();
playDirect('seStart');
  
  startBtn.style.transform = 'scale(0.94)';
  startBtn.style.opacity   = '0.88';
  setTimeout(() => {
    startBtn.style.transform = '';
    startBtn.style.opacity   = '';
    startScr.classList.add('hidden');
    runCountdown(startGame);
  }, 150);
}, { passive: false });

retryBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  e.stopPropagation();
  playDirect('seStart');
  retryBtn.style.transform = 'scale(0.94)';
  retryBtn.style.opacity   = '0.88';
  setTimeout(() => {
    retryBtn.style.transform = '';
    retryBtn.style.opacity   = '';
    resultScr.classList.add('hidden');
    runCountdown(startGame);
  }, 150);
}, { passive: false });

backBtn.addEventListener('click', () => {
  location.href = 'index.html';
});
</script>
</body>
</html>
