function getPlayCount() {
  const initialized = localStorage.getItem("wanwan_play_initialized");
  let count = Number(localStorage.getItem(PLAY_KEY));

  if (!initialized) {
    count = PLAY_START;
    localStorage.setItem(PLAY_KEY, count);
    localStorage.setItem("wanwan_play_initialized", "1");
    localStorage.setItem(PLAY_LAST_RECOVER_KEY, Date.now());
    return count;
  }

  if (isNaN(count)) {
    count = PLAY_START;
    localStorage.setItem(PLAY_KEY, count);
  }

  return Math.min(count, PLAY_MAX);
}

function getRecoveredPlayCount() {
  let count = getPlayCount();
  let lastRecover = Number(localStorage.getItem(PLAY_LAST_RECOVER_KEY) || Date.now());
  let now = Date.now();

  if (!localStorage.getItem(PLAY_LAST_RECOVER_KEY)) {
    localStorage.setItem(PLAY_LAST_RECOVER_KEY, now);
    return count;
  }

  let elapsed = now - lastRecover;
  let recovered = Math.floor(elapsed / PLAY_RECOVER_MS);

  if (recovered > 0) {
    count = Math.min(count + recovered, PLAY_MAX);
    localStorage.setItem(PLAY_KEY, count);

    let nextBase = lastRecover + recovered * PLAY_RECOVER_MS;
    localStorage.setItem(PLAY_LAST_RECOVER_KEY, nextBase);
  }

  return count;
}

      extraPaw.style.left = x2 + 'px';
      extraPaw.style.top = y2 + 'px';
      extraPaw.style.display = 'block';
      extraPaw.dataset.hit = "";
      extraPaw.style.pointerEvents = "auto";
      extraPaw.classList.remove("rare", "triple", "tap-anim");

      if (forceTripleNext || Math.random() < 0.35) {
        forceTripleNext = false;

        setTimeout(() => {
          thirdPaw = pawEl.cloneNode(true);
          thirdPaw.id = "";
          gameArea.appendChild(thirdPaw);

          const x3 = margin + Math.random() * (areaW - margin * 2);
          const y3 = margin + Math.random() * (areaH - margin * 2);

          thirdPaw.style.left = x3 + 'px';
          thirdPaw.style.top = y3 + 'px';
          thirdPaw.style.display = 'block';
          thirdPaw.dataset.hit = "";
          thirdPaw.style.pointerEvents = "auto";
          thirdPaw.classList.remove("rare", "tap-anim");
          thirdPaw.classList.add("triple");

          thirdPaw.addEventListener('touchstart', onPawTap, { passive: false });
        }, 350);
      }

      if (Math.random() < 0.5) {
        pawEl.classList.add("rare");
        extraPaw.classList.remove("rare");
      } else {
        extraPaw.classList.add("rare");
        pawEl.classList.remove("rare");
      }
    }, 200);
  } else {
    pawEl.classList.remove("rare");
  }
}
 function placeDogRunPaws() {
  const areaW = gameArea.offsetWidth;
  const areaH = gameArea.offsetHeight;
  const margin = 50;

  const pawCount = 8;
const bottomSafe = 220;
  for (let i = 0; i < pawCount; i++) {
    const paw = pawEl.cloneNode(true);
    paw.id = "";

    const x = margin + Math.random() * (areaW - margin * 2);
   const y = margin + Math.random() * (areaH - margin * 2 - bottomSafe);
    paw.style.left = x + 'px';
    paw.style.top = y + 'px';
    paw.style.display = 'block';
    paw.dataset.hit = "";
    paw.style.pointerEvents = "auto";
    paw.classList.remove("rare", "triple", "tap-anim");
if (Math.random() < 0.85) {
  paw.classList.add("rare");
}
    paw.addEventListener('touchstart', onPawTap, { passive: false });

    gameArea.appendChild(paw);

  }
}
  function spawnRipple(x, y) {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left   = x + 'px';
    r.style.top    = y + 'px';
    r.style.width  = '60px';
    r.style.height = '60px';
    gameArea.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  }

 function onPawTap(e) {
if (!active && !isEnding) return;
if (isGameOver) return; // ←これ追加

  e.preventDefault();
  e.stopPropagation();

  const tappedPaw = e.currentTarget;

  if (tappedPaw.dataset.hit === "1") return;
  tappedPaw.dataset.hit = "1";
  tappedPaw.style.pointerEvents = "none";
  tappedPaw.style.display = "none";

  let addScore = 1;

  if (tappedPaw.classList.contains("triple")) {
  addScore = 4;

  const base = document.getElementById("seTriple");
  if (base) {
    const a = base.cloneNode();
    a.currentTime = 0;
    a.play().catch(() => {});
  }

  if (!tripleChainUsed) {
    forceTripleNext = true;
    
  }

} else if (tappedPaw.classList.contains("rare")) {
  addScore = 3;
  playRare();

} else {
  playTap();
}

  score += addScore;
  scoreEl.textContent = score;

  const now = Date.now();
  if (now - lastTapTime < 250) {
    comboCount++;
  } else {
    comboCount = 0;
  }
  lastTapTime = now;

 const rect = gameArea.getBoundingClientRect();
const touch = e.touches ? e.touches[0] : e;
const rx = touch.clientX - rect.left;
const ry = touch.clientY - rect.top;
const absoluteY = rect.top + ry;

spawnRipple(rx, ry);

if (absoluteY <= 500) {
showScorePopup(addScore, rx, 180);
}

setTimeout(() => {
  if (!active) return;

  if (isDogRun) {
   const remain = gameArea.querySelectorAll('.paw:not([style*="display: none"])').length;
    if (remain < 6) {
      placeDogRunPaws();
    }
  } else {
    placePaw();
  }
}, 60);
  }
  pawEl.addEventListener('touchstart', onPawTap, { passive: false });
  
function startGame() {
  clearInterval(gameTimer);
  isGameOver = false;
  isEnding = false;

  const dim = document.getElementById("endDim");
  dim.style.opacity = "0";
  dim.style.pointerEvents = "none";

  score = 0;
  timeLeft = GAME_DURATION;


updatePlayCountUI();

  isDogRun = false;

  scoreEl.textContent = '0';
  timeEl.textContent = GAME_DURATION;
  timeEl.classList.remove('urgent');
  timeEl.style.color = "";
  timeEl.style.animation = "";
  timeEl.style.transform = "scale(1)";

  active = true;
  placePaw();

  gameTimer = setInterval(() => {
    if (timeLeft > 0) {
      timeLeft--;
    }
    timeEl.textContent = Math.max(timeLeft, 0);

    if (timeLeft === 2 || timeLeft === 1) {
      timeEl.style.color = "#ff0000";
      timeEl.style.animation = "dangerShake 0.2s infinite";

      const c = document.getElementById("seCount");
      if (c) {
        c.currentTime = 0;
        c.play().catch(() => {});
      }
    } else {
      timeEl.style.color = "";
      timeEl.style.animation = "";
      timeEl.style.transform = "scale(1)";
    }

    if (timeLeft <= 0 && !isEnding) {
      isEnding = true;

      setTimeout(() => {
        isGameOver = true;
        endGame();
      }, 150);
    }
  }, 1000);
}
function startDogRun() {
  isDogRun = true;
  document.body.classList.add("dogrun");

  setTimeout(() => {
    isDogRun = false;
    document.body.classList.remove("dogrun");

    const paws = gameArea.querySelectorAll('.paw');
    paws.forEach(p => {
      if (p !== pawEl) p.remove();
    });

  }, 5000);
}

function endGame() {
  clearInterval(gameTimer);
  gameTimer = null;
  active = false;
  isGameOver = true;
  isEnding = false;

  const dim = document.getElementById("endDim");
  dim.style.opacity = "1";
 dim.style.pointerEvents = "none";
  timeEl.classList.remove('urgent');

  resultScore.textContent = score;
  resultComment.textContent = getComment(score);
const seResult = document.getElementById("seResult");
if (seResult) {
  seResult.currentTime = 0;
  setTimeout(() => {
    seResult.play().catch(() => {});
  }, 600);
}
  

  // ① まず止まる（余韻①）
  setTimeout(() => {
    pawEl.style.display = 'none';
    if (extraPaw) {
      extraPaw.style.display = 'none';
    }
if (thirdPaw) {
  thirdPaw.style.display = 'none';
}
    // ② 少し間を空けて結果表示（余韻②）
    setTimeout(() => {
      resultScr.classList.remove('hidden');
    }, 500);

  }, 500);

  let totalScore = Number(localStorage.getItem("wanwan_score") || 0);
totalScore += score;
localStorage.setItem("wanwan_score", totalScore);

let hiScore = Number(localStorage.getItem("wanwan_hi_score") || 0);
if (score > hiScore) {
  localStorage.setItem("wanwan_hi_score", score);
}

updateHiScoreUI();
}
  function runCountdown(cb) {
    countScr.classList.remove('hidden');
    let n = 3;
    countNum.textContent = n;

    const tick = () => {
      countNum.classList.remove('countPop');
      void countNum.offsetWidth;
      countNum.classList.add('countPop');

      if (n <= 0) {
        countScr.classList.add('hidden');
        cb();
        return;
      }
      countNum.textContent = n;
      n--;
      setTimeout(tick, 700);
    };
    tick();
  }

startBtn.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();

  if (!isDev) {
    const playsLeft = getRecoveredPlayCount();
    if (playsLeft <= 0) {
      alert("プレイ回数がありません🐾\n8時間ごとに1回復します");
      return;
    }

    let plays = playsLeft;
    plays = Math.max(plays - 1, 0);
    localStorage.setItem(PLAY_KEY, plays);
  }

  playStartSound();
  unlockSound();

  startBtn.style.transform = 'scale(0.94)';
  startBtn.style.opacity = '0.88';

  setTimeout(() => {
    startBtn.style.transform = '';
    startBtn.style.opacity = '';

    startScr.classList.add('hidden');
    runCountdown(startGame);
  }, 150);
});

 function playStartSound() {

  a.pause();

}
const backBtn = document.getElementById("backBtn");

if (backBtn) {
  backBtn.addEventListener("click", () => {
    location.replace("index.html" + location.search);
  });

  backBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    location.replace("index.html" + location.search);
  }, { passive: false });
}
function showScorePopup(score, x, y) {
  const el = document.createElement("div");
  el.textContent = "+" + score;

 if (score === 3) {
  el.classList.add("score-popup", "gold");
}
if (score === 4) {
  el.classList.add("score-popup", "rainbow", "super");

  
}
el.style.position = "absolute";
el.style.left = x + "px";
el.style.top = Math.min(y, 220) + "px";
el.style.transform = "translate(-50%, -50%)";

if (score === 4) {
  el.style.transform = "translate(-50%, -50%) scale(1.4)";
  setTimeout(() => {
    el.style.transform = "translate(-50%, -50%) scale(1)";
  }, 100);
}

el.style.fontSize = score === 4 ? "44px" : "28px";
el.style.fontWeight = "900";

if (score === 4) {
  el.style.textShadow = "0 0 8px #fff, 0 0 16px #fff";
} else {
  el.style.textShadow = "0 0 6px #000, 0 0 10px #000";
}
  el.style.pointerEvents = "none";
  el.style.zIndex = "9999";
  el.style.transition = "all 0.6s ease";

  gameArea.appendChild(el);

  setTimeout(() => {
    el.style.top = (y - 40) + "px";
    el.style.opacity = "0";
  }, 10);

  setTimeout(() => {
    el.remove();
  }, 600);
}
updatePlayCountUI();
updateHiScoreUI();
